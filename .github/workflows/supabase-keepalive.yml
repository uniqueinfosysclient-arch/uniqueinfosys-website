name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days with zero API traffic.
# This pings the REST API twice a week so the CMS stays awake even if
# site traffic dips. Secrets: SUPABASE_URL, SUPABASE_ANON_KEY.

on:
  schedule:
    - cron: '0 3 * * 1,4' # Mon + Thu 03:00 UTC (08:30 IST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/download_links?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
          echo "Supabase is awake."
